24" class="s">reads reports · decides</text><rect x="400" y="80" width="260" height="56" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.6"/><text x="414" y="105" class="n">Team chat</text><text x="414" y="124" class="s">status · blockers</text><rect x="60" y="190" width="260" height="72" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="74" y="215" class="n">Orchestrator</text><text x="74" y="234" class="s">scheduled · plans + reviews</text><text x="74" y="250" class="s">never writes feature code</text><rect x="1270" y="190" width="260" height="72" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="1284" y="215" class="n">Tester</text><text x="1284" y="234" class="s">runs when main changes</text><text x="1284" y="250" class="s">CI · replays · real browser</text><rect x="60" y="390" width="260" height="80" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="74" y="415" class="n">Task board</text><text x="74" y="434" class="s">TASKS.md on its own branch</text><text x="74" y="450" class="s">atomic claims</text><rect x="950" y="390" width="220" height="80" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/><text x="964" y="415" class="n">PR + CI</text><text x="964" y="434" class="s">one PR per task</text><text x="964" y="450" class="s">auto-merge when green</text><rect x="1270" y="390" width="260" height="80" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="1284" y="415" class="n">main</text><text x="1284" y="434" class="s">protected: PR + CI</text><text x="1284" y="450" class="s">always demo-able</text><rect x="420" y="365" width="440" height="70" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="434" y="390" class="n">Host workers</text><text x="434" y="409" class="s">always-on server · any class</text><text x="434" y="425" class="s">Claude Code or Codex</text><rect x="420" y="455" width="440" height="70" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6" stroke-dasharray="6,4"/><text x="434" y="480" class="n">Teammate workers</text><text x="434" y="499" class="s">own machine · own credits</text><text x="434" y="515" class="s">class chosen by budget (see below)</text><rect x="50" y="695" width="355" height="56" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="64" y="720" class="n">1 · Get access</text><text x="64" y="739" class="s">accept the repo invite (write)</text><rect x="430" y="695" width="355" height="56" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="444" y="720" class="n">2 · Set up machine</text><text x="444" y="739" class="s">clone · gh login · claude/codex login</text><rect x="810" y="695" width="355" height="56" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="824" y="720" class="n">3 · Pick a class</text><text x="824" y="739" class="s">by budget: light / standard / heavy</text><rect x="1190" y="695" width="355" height="56" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="1204" y="720" class="n">4 · Start a worker</text><text x="1204" y="739" class="s">AGENT=name CLASS=c scripts/worker.sh</text><rect x="50" y="775" width="490" height="72" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="64" y="800" class="n">Big budget → heavy</text><text x="64" y="819" class="s">strongest model, max effort</text><text x="64" y="835" class="s">contracts · integration · design</text><rect x="560" y="775" width="490" height="72" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="574" y="800" class="n">Medium budget → standard</text><text x="574" y="819" class="s">mid model, normal effort</text><text x="574" y="835" class="s">one module behind a fixed interface</text><rect x="1070" y="775" width="490" height="72" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="1084" y="800" class="n">Low credits → light</text><text x="1084" y="819" class="s">cheap model, low effort</text><text x="1084" y="835" class="s">self-contained tasks, exact files listed</text><text x="640" y="548" class="a" text-anchor="middle">each task = fresh session · idle workers cost nothing</text><circle cx="130" cy="325" r="11" fill="#0f172a"/><text x="130" y="329" class="b" text-anchor="middle">1</text><text x="147" y="329" class="a">plan · reconcile</text><circle cx="359" cy="430" r="11" fill="#0f172a"/><text x="359" y="434" class="b" text-anchor="middle">2</text><text x="359" y="413" class="a" text-anchor="middle">claim</text><circle cx="914" cy="430" r="11" fill="#0f172a"/><text x="914" y="434" class="b" text-anchor="middle">3</text><text x="914" y="413" class="a" text-anchor="middle">open PR</text><circle cx="1219" cy="430" r="11" fill="#0f172a"/><text x="1219" y="434" class="b" text-anchor="middle">4</text><text x="1219" y="413" class="a" text-anchor="middle">merge</text><text x="1219" y="458" class="a" text-anchor="middle">if CI green</text><circle cx="1440" cy="327" r="11" fill="#0f172a"/><text x="1440" y="331" class="b" text-anchor="middle">5</text><text x="1457" y="331" class="a">test</text><circle cx="880" cy="610" r="11" fill="#0f172a"/><text x="880" y="614" class="b" text-anchor="middle">6</text><text x="880" y="593" class="a" text-anchor="middle">files Bug: tasks</text><circle cx="800" cy="300" r="11" fill="#0f172a"/><text x="800" y="304" class="b" text-anchor="middle">7</text><text x="800" y="283" class="a" text-anchor="middle">review merged work</text><circle cx="360" cy="165" r="11" fill="#0f172a"/><text x="360" y="169" class="b" text-anchor="middle">8</text><text x="360" y="148" class="a" text-anchor="middle">report</text><circle cx="1030" cy="108" r="11" fill="#0f172a"/><text x="1030" y="112" class="b" text-anchor="middle">8</text><text x="1030" y="91" class="a" text-anchor="middle">status · blockers</text><text x="50" y="880" class="a" style="font-size:12px">· Workers only take tasks at or below their class; the orchestrator keeps cheap tasks stocked so low-credit teammates always have work.</text><text x="50" y="900" class="a" style="font-size:12px">· Same rules for everyone: same CI, same auto-merge, PRs show under each teammate's own GitHub account.</text><text x="50" y="920" class="a" style="font-size:12px">· Tests and CI use fakes for paid APIs, so a teammate's worker never spends shared API credits.</text><rect x="30" y="966" width="14" height="14" rx="3" fill="#fffbeb" stroke="#d97706"/><text x="50" y="977" class="a">scheduled coordinator</text><rect x="243" y="966" width="14" height="14" rx="3" fill="#ecfdf5" stroke="#059669"/><text x="263" y="977" class="a">worker</text><rect x="351" y="966" width="14" height="14" rx="3" fill="#f5f3ff" stroke="#7c3aed"/><text x="371" y="977" class="a">git branch</text><rect x="487" y="966" width="14" height="14" rx="3" fill="#fff7ed" stroke="#ea580c"/><text x="507" y="977" class="a">PR / CI</text><rect x="602" y="966" width="14" height="14" rx="3" fill="#ecfeff" stroke="#0891b2"/><text x="622" y="977" class="a">people / chat</text><rect x="759" y="966" width="14" height="14" rx="3" fill="#f1f5f9" stroke="#64748b"/><text x="779" y="977" class="a">setup step</text><circle cx="1180" cy="973" r="9" fill="#0f172a"/><text x="1180" y="977" class="b" text-anchor="middle" style="font-size:10px">n</text><text x="1196" y="977" class="a">order of the loop</text>
