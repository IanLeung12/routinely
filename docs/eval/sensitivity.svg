<circle cx="369.0" cy="64.0" r="6" class="dot"/><circle cx="369.0" cy="64.0" r="6" class="ring"/><text x="369.0" y="50.0" class="label" text-anchor="middle">k=1.5</text><circle cx="56.0" cy="64.0" r="6" class="dot"/><circle cx="56.0" cy="64.0" r="6" class="ring"/><text x="56.0" y="50.0" class="label" text-anchor="middle">k=2,2.5</text>
