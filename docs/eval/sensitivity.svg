<text x="46" y="239.0" class="tick" text-anchor="end">25%</text>
<line x1="56" y1="178.0" x2="536" y2="178.0" class="grid"/>
<text x="46" y="182.0" class="tick" text-anchor="end">50%</text>
<line x1="56" y1="121.0" x2="536" y2="121.0" class="grid"/>
<text x="46" y="125.0" class="tick" text-anchor="end">75%</text>
