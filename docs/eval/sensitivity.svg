<svg viewBox="0 0 560 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="False alarms per person per month versus sudden-change catch rate, at three threshold settings">
<style>.surface { fill: #fcfcfb; } .grid { stroke: #e3e2dd; stroke-width: 1; } .axis { stroke: #52514e; stroke-width: 1; } .tick { fill: #52514e; font: 11px sans-serif; } .label { fill: #0b0b0b; font: 12px sans-serif; font-weight: 600; } .title { fill: #0b0b0b; font: 14px sans-serif; font-weight: 600; } .subtitle { fill: #52514e; font: 11px sans-serif; } .line { stroke: #2a78d6; stroke-width: 2; fill: none; } .dot { fill: #2a78d6; } .ring { fill: none; stroke: #fcfcfb; stroke-width: 2; } @media (prefers-color-scheme: dark) { .surface { fill: #1a1a19; } .grid { stroke: #33332f; } .axis { stroke: #c3c2b7; } .tick { fill: #c3c2b7; } .label { fill: #ffffff; } .title { fill: #ffffff; } .subtitle { fill: #c3c2b7; } .line { stroke: #3987e5; } .dot { fill: #3987e5; } .ring { stroke: #1a1a19; } }</style>
<rect class="surface" x="0" y="0" width="560" height="340"/>
<text x="56" y="20" class="title">Catch rate vs. false alarms, by threshold</text>
