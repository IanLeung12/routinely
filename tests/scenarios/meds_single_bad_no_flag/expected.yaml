# The meds counterpart of tea_single_bad_no_flag: one bad session after quiet
# history produces errors but never flags a change on its own.
#
# The pill comes out of the organiser a second time (perseveration, the same slip
# meds_pill_twice exercises) and the water is never drunk (omission on drink_water,
# a dry swallow, the same slip meds_skip_water exercises). No other bad session is
# anywhere in the history, so there is nothing within 48 hours to pair it with.

task: meds

steps:
  - get_glass
  - open_organiser
  - take_pill
  - fill_glass
  - take_pill # again, with fill_glass in between
  # drink_water never happens: the pill went down dry

errors:
  - { type: perseveration, step: take_pill }
  - { type: omission, step: drink_water }
score: 5.0 # perseveration 2.0 + omission 3.0

# Thirteen days of quiet mornings establish a baseline; nothing here is a second bad
# session, so the 48h-window rule never has a second session to pair with.
history:
  - { hours_ago: 312, score: 0.0 }
  - { hours_ago: 288, score: 0.0 }
  - { hours_ago: 264, score: 1.0 }
  - { hours_ago: 240, score: 0.0 }
  - { hours_ago: 216, score: 0.0 }
  - { hours_ago: 192, score: 0.5 }
  - { hours_ago: 168, score: 0.0 }
  - { hours_ago: 144, score: 0.0 }
  - { hours_ago: 120, score: 1.0 }
  - { hours_ago: 96, score: 0.0 }
  - { hours_ago: 72, score: 0.0 }
  - { hours_ago: 30, score: 0.0 }

flag: false
