# Guards the 48h window: today's bad session (drink_water skipped, pill taken twice)
# plus one bad session 60 hours ago, with quiet history otherwise, must NOT flag —
# the two bad sessions are more than 48h apart.

task: meds

steps:
  - get_glass
  - open_organiser
  - take_pill
  - fill_glass
  - take_pill # again, with fill_glass in between
  # drink_water never happens: the pill went down dry

errors:
  - { type: perseveration, step: take_pill }
  - { type: omission, step: drink_water }
score: 5.0 # perseveration 2.0 + omission 3.0

# Thirteen days of quiet mornings, then one bad session 60 hours ago.
history:
  - { hours_ago: 312, score: 0.0 }
  - { hours_ago: 288, score: 0.0 }
  - { hours_ago: 264, score: 1.0 }
  - { hours_ago: 240, score: 0.0 }
  - { hours_ago: 216, score: 0.0 }
  - { hours_ago: 192, score: 0.5 }
  - { hours_ago: 168, score: 0.0 }
  - { hours_ago: 144, score: 0.0 }
  - { hours_ago: 120, score: 1.0 }
  - { hours_ago: 96, score: 0.0 }
  - { hours_ago: 72, score: 0.0 }
  - { hours_ago: 60, errors: { omission: 1, hesitation: 1 } }

# Two bad sessions 60 hours apart, outside the 48h window, so no flag.
flag: false
