# The resident boils the kettle, goes to get a cup, then boils it again before
# finishing the tea normally.
#
# One error from SPEC section 7's table: boiling is a once_only step in tea.yaml, and
# it happens again with get_cup in between, so it is perseveration on `boil` rather
# than the recogniser seeing one action twice (no step in between) or an omission
# (every required step still happens). Everything else about the session is normal.
#
# The resident made the same slip yesterday: quiet history, then one other
# perseveration-only session 30 hours ago, so this second bad session inside 48 hours
# is what flags a change for a nurse to review.

task: tea

steps:
  - fill_kettle
  - boil
  - get_cup
  - boil # again, with get_cup in between
  - teabag_in_cup
  - pour
  - stir
  - remove_teabag

errors:
  - { type: perseveration, step: boil }
score: 2.0 # perseveration 2.0

# Eleven quiet sessions, then one other kettle-reboil session 30 hours ago.
history:
  - { hours_ago: 312, score: 0.0 }
  - { hours_ago: 288, score: 0.0 }
  - { hours_ago: 264, score: 0.0 }
  - { hours_ago: 240, score: 0.0 }
  - { hours_ago: 216, score: 0.0 }
  - { hours_ago: 192, score: 0.0 }
  - { hours_ago: 168, score: 0.0 }
  - { hours_ago: 144, score: 0.0 }
  - { hours_ago: 120, score: 0.0 }
  - { hours_ago: 96, score: 0.0 }
  - { hours_ago: 72, score: 0.0 }
  - { hours_ago: 30, errors: { perseveration: 1 } }

# Two sessions above this resident's own threshold inside 48 hours.
flag: true
