# The meds counterpart of tea_long_pause_not_error: an otherwise-correct session
# with one unusually long gap - 100 seconds between taking the pill and filling the
# glass, against ~2-6 seconds everywhere else. That is under the abandonment
# threshold (120s, routine_watch.errors.ABANDON_AFTER_S), so it is not abandonment,
# and a gap this long - a hesitation, per routine_watch.hesitation - is not
# something classify_errors reports at all: the hesitation stage is not folded into
# replay yet (see replay.py's module docstring).
# The point is that a long pause on its own, below the abandonment cutoff, must
# never surface as a task error or flag a change.
task: meds

steps:
  - get_glass
  - open_organiser
  - take_pill
  - fill_glass # 100s after take_pill, still under the 120s abandonment threshold
  - drink_water

errors: []
score: 0.0

flag: false
