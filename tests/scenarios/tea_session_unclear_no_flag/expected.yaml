# Bad lighting makes most of this session's observations low-confidence: only the two
# pour events and the stir between them come through clearly, so 4 of 7 events are
# unclear - over session_quality's 40% threshold. The steps and errors underneath are
# tea_skip_teabag_pour_twice's demo-bad session verbatim (teabag omitted, pour redone
# with a stir in between), against the same otherwise-flagging history, so this
# scenario proves the quality gate - not an empty session or a quiet history - is what
# keeps it from scoring and flagging: the capture cannot be trusted, so it is never
# scored at all (SPEC section 12).

task: tea

steps:
  - fill_kettle
  - boil
  - get_cup
  # teabag_in_cup never happens
  - pour
  - stir
  - pour # again, with a step in between
  - remove_teabag # fishing for a teabag that was never in the cup

errors:
  - { type: omission, step: teabag_in_cup }
  - { type: perseveration, step: pour }

quality: unclear
score: 0.0
flag: false

# Twelve days of quiet tea, then one bad session 30 hours ago: the same history that
# makes tea_skip_teabag_pour_twice flag. Proves the quality gate suppresses the flag
# even when the history alone would have allowed it.
history:
  - { hours_ago: 312, score: 0.0 }
  - { hours_ago: 288, score: 0.0 }
  - { hours_ago: 264, score: 1.0 }
  - { hours_ago: 240, score: 0.0 }
  - { hours_ago: 216, score: 0.0 }
  - { hours_ago: 192, score: 0.5 }
  - { hours_ago: 168, score: 0.0 }
  - { hours_ago: 144, score: 0.0 }
  - { hours_ago: 120, score: 1.0 }
  - { hours_ago: 96, score: 0.0 }
  - { hours_ago: 72, score: 0.0 }
  - { hours_ago: 30, errors: { omission: 1, hesitation: 1 } }
