name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  part:
    name: ci-${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        part: [tooling, python, web, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "pipeline/uv.lock"
      - uses: actions/setup-node@v4
        if: matrix.part == 'web'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: bash scripts/ci.sh
        env:
          CI_PARTS: ${{ matrix.part }}
  # The required status check is named "ci": it passes only if every part passed.
  ci:
    runs-on: ubuntu-latest
    needs: part
    if: always()
    steps:
      - run: '[ "${{ needs.part.result }}" = success ] || { echo "a CI part failed: ${{ needs.part.result }}"; exit 1; }'
