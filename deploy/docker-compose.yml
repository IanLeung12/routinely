name: routine-watch
services:
  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      OFFLINE_MODE: ${OFFLINE_MODE:-true}
      LIVE_API: ${LIVE_API:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      API_CACHE_DIR: /app/.data/cache
    ports:
      - "8000:8000"
    volumes:
      - replay-data:/app/.data
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: timescale/timescaledb:2.17.2-pg16
    profiles: [tsdb]
    env_file:
      - path: ../.env
        required: false
    environment:
      POSTGRES_USER: routine_watch
      POSTGRES_DB: routine_watch
    volumes:
      - tsdb-data:/var/lib/postgresql/data
      - ../pipeline/sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U routine_watch -d routine_watch"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
volumes:
  replay-data:
  tsdb-data:
